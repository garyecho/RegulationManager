[project]
name = "regulation-manager"
version = "1.2.3"
description = "制度汇编管理系统"
requires-python = ">=3.8"
dependencies = [
    "PyQt5>=5.15",
    "SQLAlchemy>=2.0",
    "PyMuPDF>=1.23",
    "python-docx>=1.0",
    "jieba>=0.42",
]

# 本仓库是平铺桌面应用（python main.py 启动，无同名顶层包），
# 不把项目自身构建/安装为包，只同步依赖。
[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
